apiVersion: v1
kind: Pod
metadata:
  name: demo-multi-container
  namespace: netdrill-demo
  labels:
    app: complex-service
    tier: microservice
    architecture: multi-container
  annotations:
    netdrill.demo/description: "Use to test --same-as-container selection and container-specific resource/port/env cloning"
spec:
  serviceAccountName: netdrill-tester-sa
  containers:
    - name: api-gateway
      image: registry.k8s.io/e2e-test-images/agnhost:2.45
      args: ["netexec", "--http-port=8080"]
      ports:
        - name: http
          containerPort: 8080
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      env:
        - name: SERVICE_ROLE
          value: "gateway"
        - name: LISTEN_PORT
          value: "8080"
      volumeMounts:
        - name: config-volume
          mountPath: /etc/gateway/config
          readOnly: true

    - name: envoy-proxy
      image: registry.k8s.io/e2e-test-images/agnhost:2.45
      args: ["netexec", "--http-port=10000", "--udp-port=-1"]
      ports:
        - name: ingress
          containerPort: 10000
        - name: admin
          containerPort: 9901
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      env:
        - name: SERVICE_ROLE
          value: "sidecar-proxy"
        - name: PROXY_PORT
          value: "10000"
      volumeMounts:
        - name: proxy-cache
          mountPath: /var/cache/proxy

    - name: log-shipper
      image: registry.k8s.io/e2e-test-images/agnhost:2.45
      command: ["/agnhost", "pause"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      env:
        - name: SERVICE_ROLE
          value: "logger"
        - name: LOG_DESTINATION
          value: "opensearch.internal"
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/shipper/certs
          readOnly: true
  volumes:
    - name: config-volume
      configMap:
        name: app-config
    - name: secret-volume
      secret:
        secretName: app-secret
    - name: proxy-cache
      emptyDir: {}

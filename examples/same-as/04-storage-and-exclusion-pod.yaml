apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-storage-pvc
  namespace: netdrill-demo
  labels:
    app: stateful-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-storage-pod
  namespace: netdrill-demo
  labels:
    app: stateful-app
    tier: database-client
  annotations:
    netdrill.demo/test: "Tests that PVC volumes are excluded to prevent multi-attach conflicts while safe volumes (ConfigMap/EmptyDir) are cloned"
spec:
  serviceAccountName: netdrill-tester-sa
  containers:
    - name: client
      image: registry.k8s.io/e2e-test-images/agnhost:2.45
      command: ["/agnhost", "pause"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      volumeMounts:
        # PVC mount - should NOT be cloned by netdrill --same-as
        - name: persistent-data
          mountPath: /var/lib/data
        # Safe volumes - SHOULD be cloned by netdrill --same-as
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        - name: temp-storage
          mountPath: /tmp/scratch
  volumes:
    - name: persistent-data
      persistentVolumeClaim:
        claimName: demo-storage-pvc
    - name: config-volume
      configMap:
        name: app-config
    - name: temp-storage
      emptyDir: {}
